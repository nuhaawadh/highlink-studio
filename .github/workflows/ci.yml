name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  db:
    name: migration applies on Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: stub Supabase auth schema, roles and publication
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          -- الأدوار أولًا: منح صلاحيات storage تحت يحتاجها
          create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (
            id uuid primary key, instance_id uuid, aud text, role text, email text, encrypted_password text,
            email_confirmed_at timestamptz, raw_app_meta_data jsonb default '{}'::jsonb, raw_user_meta_data jsonb default '{}'::jsonb,
            created_at timestamptz, updated_at timestamptz
          );
          create schema storage;
          create table storage.buckets (id text primary key, name text, public boolean, file_size_limit bigint, allowed_mime_types text[]);
          create table storage.objects (id uuid primary key default gen_random_uuid(), bucket_id text references storage.buckets(id), name text);
          alter table storage.objects enable row level security;
          -- كما في Supabase: الواجهة تملك صلاحية الجدول وRLS هي الحارس (T21 يختبر سياسة الرفع)
          grant usage on schema storage to anon, authenticated, service_role;
          grant all on storage.objects to anon, authenticated, service_role;
          -- كما في Supabase: المطالبات من request.jwt.claims (JSON، PostgREST ≥ 9) مع احتياطي request.jwt.claim.* القديم
          create function auth.uid() returns uuid language sql stable as $$
            select coalesce(
              nullif(current_setting('request.jwt.claim.sub', true), ''),
              (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')
            )::uuid
          $$;
          create function auth.role() returns text language sql stable as $$
            select coalesce(
              nullif(current_setting('request.jwt.claim.role', true), ''),
              (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'role')
            )::text
          $$;
          -- صلاحيات الأدوار كما يمنحها Supabase للمخطط public (تلزم اختبارات RLS T9–T11)
          grant usage on schema public, auth to anon, authenticated, service_role;
          grant execute on all functions in schema auth to anon, authenticated, service_role;
          alter default privileges in schema public grant all on tables to anon, authenticated, service_role;
          alter default privileges in schema public grant all on sequences to anon, authenticated, service_role;
          alter default privileges in schema public grant execute on functions to anon, authenticated, service_role;
          create publication supabase_realtime;
          SQL
      - name: apply migrations and seed
        run: |
          for f in supabase/migrations/*.sql; do
            psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: credit ledger tests (supabase/tests/credits.test.sql)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/credits.test.sql
      - name: cron/vault tests (supabase/tests/cron.test.sql — job checks skipped without pg_cron)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/cron.test.sql
      - name: API v1 tests (supabase/tests/api.test.sql)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/api.test.sql
      - name: credit ledger smoke test
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, email) values ('11111111-1111-1111-1111-111111111111', 'ci@example.com');
          do $$ begin
            if public.get_balance('11111111-1111-1111-1111-111111111111') <> 30 then raise exception 'signup grant failed'; end if;
            perform public.hold_credits('11111111-1111-1111-1111-111111111111', 10, gen_random_uuid());
            if public.get_balance('11111111-1111-1111-1111-111111111111') <> 20 then raise exception 'hold failed'; end if;
          end $$;
          SQL
