# إعدادات Supabase CLI المحلية — تُولَّد عادةً بـ `supabase init`؛ هذه نسخة دنيا تكفي `supabase start`.
# إن طلب CLI إصدارًا أحدث من الملف، شغّلي `supabase init --force` واحتفظي بالقيم التالية.
project_id = "highlink-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "https://studio.highlink.tech/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.generate-media]
verify_jwt = true

# webhook المزوّد: لا JWT — الحماية بتوقيع Replicate (webhook-signature) داخل الوظيفة
[functions.provider-webhook]
verify_jwt = false

# API عامة v1 (ADR 0004): لا JWT — المصادقة بمفتاح API (hl_live_/hl_test_) داخل الوظيفة
[functions.v1]
verify_jwt = false
